<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, pageTitle)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><th:block th:text="${pageTitle}">Library</th:block> — College Library System</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">📚</div>
      <h2>College Library</h2>
      <p>Management System</p>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a th:href="@{/dashboard}" th:classappend="${requestUri == '/dashboard' or requestUri == '/'} ? ' active' : ''"><span class="nav-icon">🏠</span> Dashboard</a>
      <div class="nav-section-label">Books</div>
      <a th:href="@{/view_books}" th:classappend="${requestUri.startsWith('/view_books') or requestUri.startsWith('/edit_book')} ? ' active' : ''"><span class="nav-icon">📖</span> View Books</a>
      <a th:href="@{/add_book}" th:classappend="${requestUri == '/add_book'} ? ' active' : ''"><span class="nav-icon">➕</span> Add Book</a>
      <div class="nav-section-label">Members</div>
      <a th:href="@{/view_members}" th:classappend="${requestUri.startsWith('/view_members') or requestUri.startsWith('/edit_member')} ? ' active' : ''"><span class="nav-icon">👥</span> View Members</a>
      <a th:href="@{/add_member}" th:classappend="${requestUri == '/add_member'} ? ' active' : ''"><span class="nav-icon">👤</span> Add Member</a>
      <div class="nav-section-label">Circulation</div>
      <a th:href="@{/issue_book}" th:classappend="${requestUri == '/issue_book'} ? ' active' : ''"><span class="nav-icon">📤</span> Issue Book</a>
      <a th:href="@{/return_book}" th:classappend="${requestUri == '/return_book'} ? ' active' : ''"><span class="nav-icon">📥</span> Return Book</a>
      <a th:href="@{/view_issued_books}" th:classappend="${requestUri == '/view_issued_books'} ? ' active' : ''"><span class="nav-icon">📋</span> Issued Books</a>
      <a th:href="@{/overdue_books}" th:classappend="${requestUri == '/overdue_books'} ? ' active' : ''"><span class="nav-icon">⚠️</span> Overdue Books</a>
      <div class="nav-section-label">Administration</div>
      <a th:href="@{/admin/accounts}" th:classappend="${requestUri.startsWith('/admin/accounts')} ? ' active' : ''"><span class="nav-icon">🛡️</span> Admin Accounts</a>
      <a th:href="@{/admin/students}" th:classappend="${requestUri.startsWith('/admin/students')} ? ' active' : ''"><span class="nav-icon">🎓</span> Student Monitoring</a>
    </div>
    <div class="sidebar-footer">
      <form method="POST" th:action="@{/logout}">
        <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
        <button type="submit" class="btn btn-secondary">🚪 Logout</button>
      </form>
    </div>
  </nav>
  <div class="main-content">
    <div class="topbar">
      <h1 th:text="${pageTitle}">Dashboard</h1>
      <div class="topbar-right">👤 <span class="badge-admin" th:text="${session.adminType == 'MAIN' ? 'Main Admin' : 'Sub-admin'}">Admin</span><span th:text="${session.username ?: 'Admin'}">Admin</span></div>
    </div>
    <div class="page-content">
      <div class="flash-container" th:if="${message}">
        <div th:class="'alert alert-' + ${messageType ?: 'info'}">
          <span th:text="${messageType == 'success' ? '✅' : (messageType == 'danger' ? '❌' : (messageType == 'warning' ? '⚠️' : 'ℹ️'))}"></span>
          <span th:text="${message}"></span>
        </div>
      </div>
      <th:block th:replace="${content}"></th:block>
    </div>
  </div>
</body>
</html>
