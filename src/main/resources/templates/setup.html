<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure First-Time Setup — College Library System</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🛡️</div>
      <h1>Secure First-Time Setup</h1>
      <p>Create the main administrator account on this computer</p>
    </div>
    <div th:if="${message}" th:class="'alert alert-' + ${messageType ?: 'info'}" style="margin-bottom:16px;">
      <span th:text="${message}"></span>
    </div>
    <form method="POST" th:action="@{/setup}">
      <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
      <div class="form-group">
        <label for="username">Main Admin Username</label>
        <input id="username" type="text" name="username" minlength="3" maxlength="32"
               pattern="[A-Za-z0-9._-]{3,32}" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Main Admin Password</label>
        <input id="password" type="password" name="password" minlength="14" autocomplete="new-password" required>
        <small class="form-hint">Use at least 14 characters and store it safely.</small>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password" minlength="14" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">Create Main Admin</button>
    </form>
  </div>
</body>
</html>
