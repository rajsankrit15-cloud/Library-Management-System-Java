<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, 'Edit Member')}">
<section>
  <div class="form-card">
    <h2>✏️ Edit Member — <span th:text="${member.roll_number}"></span></h2>
    <form method="POST" th:action="@{/edit_member/{id}(id=${member.id})}">
      <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
      <div class="form-row">
        <div class="form-group"><label for="name">Full Name *</label><input id="name" type="text" name="name" th:value="${member.name}" required></div>
        <div class="form-group"><label for="roll_number">Roll Number *</label><input id="roll_number" type="text" name="roll_number" th:value="${member.roll_number}" required></div>
      </div>
      <div class="form-group"><label for="department">Department *</label><select id="department" name="department" required><option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}" th:selected="${dept == member.department}"></option></select></div>
      <div class="form-row">
        <div class="form-group"><label for="email">Email</label><input id="email" type="email" name="email" th:value="${member.email}"></div>
        <div class="form-group"><label for="phone">Phone Number</label><input id="phone" type="text" name="phone" th:value="${member.phone}"></div>
      </div>
      <div class="form-group"><label for="address">Address</label><input id="address" type="text" name="address" th:value="${member.address}"></div>
      <div class="card" style="padding:16px; margin:18px 0;">
        <strong>Student portal account:</strong>
        <span th:if="${accountEnabled}" class="badge badge-success">Enabled</span>
        <span th:unless="${accountEnabled}" class="badge badge-warning">Password not set</span>
        <div class="form-group" style="margin:14px 0 0;">
          <label for="password">Set / reset student password</label>
          <input id="password" type="password" name="password" minlength="12" autocomplete="new-password" placeholder="Leave blank to keep current password">
          <small class="form-hint">At least 12 characters. Existing password stays unchanged if left blank.</small>
        </div>
      </div>
      <div style="display:flex; gap:12px; margin-top:8px;"><button type="submit" class="btn btn-primary" style="flex:1;">💾 Save Changes</button><a th:href="@{/view_members}" class="btn btn-secondary" style="flex:1; justify-content:center;">Cancel</a></div>
    </form>
  </div>
</section>
</html>
