<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, 'Edit Book')}">
<section>
  <div class="form-card">
    <h2>✏️ Edit Book — <span th:text="${book.id}"></span></h2>
    <form method="POST" th:action="@{/edit_book/{id}(id=${book.id})}">
      <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
      <div class="form-group"><label for="title">Book Title *</label><input id="title" type="text" name="title" th:value="${book.title}" required></div>
      <div class="form-group"><label for="author">Author(s) *</label><input id="author" type="text" name="author" th:value="${book.author}" required></div>
      <div class="form-group"><label for="category">Category *</label><select id="category" name="category" required><option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat == book.category}"></option></select></div>
      <div class="form-group"><label for="quantity">Quantity *</label><input id="quantity" type="number" name="quantity" th:value="${book.quantity}" min="0" required></div>
      <div style="display:flex; gap:12px; margin-top:8px;"><button type="submit" class="btn btn-primary" style="flex:1;">💾 Save Changes</button><a th:href="@{/view_books}" class="btn btn-secondary" style="flex:1; justify-content:center;">Cancel</a></div>
    </form>
  </div>
</section>
</html>
