<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — College Library System</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">📚</div>
      <h1>College Library System</h1>
      <p>Sign in to manage and monitor the library</p>
    </div>
    <div th:if="${message}" th:class="'alert alert-' + ${messageType ?: 'info'}" style="margin-bottom:16px;">
      <span th:text="${message}"></span>
    </div>
    <form method="POST" th:action="@{/login}">
      <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">🔑 Sign In</button>
    </form>
    <p style="text-align:center; margin-top:16px;"><a th:href="@{/student/login}">Student? Sign in to your account →</a></p>
  </div>
</body>
</html>
