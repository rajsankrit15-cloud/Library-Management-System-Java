<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, 'Books Catalog')}">
<section>
  <div class="table-container">
    <div class="table-toolbar">
      <h2>📚 All Books</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <form class="search-form" method="GET" th:action="@{/view_books}">
          <div class="input-group"><input type="text" name="q" th:value="${query}" placeholder="Search title, author…"><button type="submit">🔍</button></div>
          <select name="category" class="filter-select" onchange="this.form.submit()">
            <option value="">All Categories</option>
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat == categoryFilter}"></option>
          </select>
          <a th:if="${query != '' or categoryFilter != ''}" th:href="@{/view_books}" class="btn btn-secondary btn-sm">✕ Clear</a>
        </form>
        <a th:href="@{/add_book}" class="btn btn-primary btn-sm">➕ Add Book</a>
      </div>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>Copies</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        <tr th:each="book : ${books}">
          <td><span class="badge badge-secondary" th:text="${book.id}"></span></td><td><strong th:text="${book.title}"></strong></td>
          <td th:text="${book.author}"></td><td><span class="badge badge-primary" th:text="${book.category}"></span></td>
          <td th:text="${book.quantity}"></td><td>
            <span th:if="${book.quantity == 0}" class="badge badge-danger">Out of Stock</span>
            <span th:if="${book.quantity > 0 and book.quantity <= 2}" class="badge badge-warning">Low Stock</span>
            <span th:if="${book.quantity > 2}" class="badge badge-success">Available</span>
          </td>
          <td><div class="action-btns">
            <a th:href="@{/edit_book/{id}(id=${book.id})}" class="btn btn-warning btn-sm">✏️ Edit</a>
            <form method="POST" th:action="@{/delete_book/{id}(id=${book.id})}" onsubmit="return confirm('Delete this book?');" style="display:inline;"><input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}"><button type="submit" class="btn btn-danger btn-sm">🗑️</button></form>
          </div></td>
        </tr>
        <tr th:if="${#lists.isEmpty(books)}"><td colspan="7"><div class="empty-state"><div class="empty-icon">📭</div><p>No books found. <a th:href="@{/add_book}">Add one now</a>.</p></div></td></tr>
      </tbody>
    </table>
  </div>
</section>
</html>
