<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, 'Create Sub-admin')}">
<section>
  <div class="form-card">
    <h2>🛡️ Create a Sub-admin</h2>
    <p class="toolbar-subtitle" style="margin:-14px 0 22px;">Sub-admins can manage the library and create other sub-admin accounts.</p>
    <form method="POST" th:action="@{/admin/accounts}">
      <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
      <div class="form-group">
        <label for="username">Admin Username</label>
        <input id="username" type="text" name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" autocomplete="username" placeholder="e.g. library.staff" required>
        <small class="form-hint">3–32 letters, numbers, dots, underscores, or hyphens.</small>
      </div>
      <div class="form-group">
        <label for="password">Temporary Password</label>
        <input id="password" type="password" name="password" minlength="12" autocomplete="new-password" required>
        <small class="form-hint">At least 12 characters. Share it securely with the new admin.</small>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
      </div>
      <div style="display:flex; gap:12px; margin-top:8px;">
        <button type="submit" class="btn btn-primary" style="flex:1;">Create Sub-admin</button>
        <a th:href="@{/admin/accounts}" class="btn btn-secondary" style="flex:1; justify-content:center;">Cancel</a>
      </div>
    </form>
  </div>
</section>
</html>
