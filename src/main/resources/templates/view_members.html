<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, 'Members')}">
<section>
  <div class="table-container">
    <div class="table-toolbar">
      <h2>👥 All Members</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <form class="search-form" method="GET" th:action="@{/view_members}">
          <div class="input-group"><input type="text" name="q" th:value="${query}" placeholder="Search name, roll number…"><button type="submit">🔍</button></div>
          <select name="department" class="filter-select" onchange="this.form.submit()">
            <option value="">All Departments</option>
            <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}" th:selected="${dept == departmentFilter}"></option>
          </select>
          <a th:if="${query != '' or departmentFilter != ''}" th:href="@{/view_members}" class="btn btn-secondary btn-sm">✕ Clear</a>
        </form>
        <a th:href="@{/add_member}" class="btn btn-primary btn-sm">👤 Add Member</a>
      </div>
    </div>
    <table>
      <thead><tr><th>Roll No.</th><th>Name</th><th>Department</th><th>Email</th><th>Phone</th><th>Student Portal</th><th>Books Issued</th><th>Join Date</th><th>Actions</th></tr></thead>
      <tbody>
        <tr th:each="member : ${members}">
          <td><span class="badge badge-primary" th:text="${member.roll_number}"></span></td><td><strong th:text="${member.name}"></strong></td>
          <td th:text="${member.department}"></td><td th:text="${member.email ?: '—'}"></td><td th:text="${member.phone ?: '—'}"></td>
          <td><span th:if="${member.account_enabled == 1}" class="badge badge-success">Enabled</span><span th:unless="${member.account_enabled == 1}" class="badge badge-warning">Set password</span></td>
          <td><th:block th:with="cnt=${issueCounts[member.id] ?: 0}">
            <span th:if="${cnt == 3}" class="badge badge-danger" th:text="${cnt + '/3 (Max)'}"></span>
            <span th:if="${cnt > 0 and cnt < 3}" class="badge badge-warning" th:text="${cnt + '/3'}"></span>
            <span th:if="${cnt == 0}" class="badge badge-success">0/3</span>
          </th:block></td>
          <td th:text="${member.join_date}"></td>
          <td><div class="action-btns">
            <a th:href="@{/edit_member/{id}(id=${member.id})}" class="btn btn-warning btn-sm">✏️ Edit</a>
            <form method="POST" th:action="@{/delete_member/{id}(id=${member.id})}" onsubmit="return confirm('Delete this member?');" style="display:inline;"><input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}"><button type="submit" class="btn btn-danger btn-sm">🗑️</button></form>
          </div></td>
        </tr>
        <tr th:if="${#lists.isEmpty(members)}"><td colspan="9"><div class="empty-state"><div class="empty-icon">👤</div><p>No members found. <a th:href="@{/add_member}">Register one now</a>.</p></div></td></tr>
      </tbody>
    </table>
  </div>
</section>
</html>
