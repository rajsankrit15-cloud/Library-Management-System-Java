<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — College Library System</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🎓</div>
      <h1>Create Student Account</h1>
      <p>Use your library details and the one-time code from your librarian</p>
    </div>
    <div th:if="${message}" th:class="'alert alert-' + ${messageType ?: 'info'}" style="margin-bottom:16px;">
      <span th:text="${message}"></span>
    </div>
    <form method="POST" th:action="@{/student/register}">
      <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
      <div class="form-group">
        <label for="roll_number">Library Roll Number</label>
        <input id="roll_number" type="text" name="roll_number" placeholder="e.g. CS2021001" required autofocus>
      </div>
      <div class="form-group">
        <label for="email">Registered Email Address</label>
        <input id="email" type="email" name="email" placeholder="The email on your library record" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="activation_code">One-time invitation code</label>
        <input id="activation_code" type="text" name="activation_code" autocomplete="one-time-code" required>
      </div>
      <div class="form-group">
        <label for="password">Create Password</label>
        <input id="password" type="password" name="password" minlength="12" autocomplete="new-password" required>
        <small class="form-hint">Use at least 12 characters.</small>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">Create Account</button>
    </form>
    <p style="text-align:center; margin-top:18px;"><a th:href="@{/student/login}">Back to student sign in →</a></p>
  </div>
</body>
</html>
